services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: commercelab
      POSTGRES_DB: commercelab
      POSTGRES_PASSWORD: ${COMMERCE_DB_PASSWORD:?Set COMMERCE_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "commercelab", "-d", "commercelab"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://commercelab@db:5432/commercelab
      PGPASSWORD: ${COMMERCE_DB_PASSWORD:?Set COMMERCE_DB_PASSWORD in .env}
      APP_ENV: ${APP_ENV:-demo}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RESERVATION_HOLD_MINUTES: ${RESERVATION_HOLD_MINUTES:-15}
      SIMULATED_DECLINE_PERCENT: ${SIMULATED_DECLINE_PERCENT:-5}
    command:
      - sh
      - -c
      - python -m scripts.check_shop_schema && exec uvicorn commercelab.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    mem_limit: 512m
    cpus: 1

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    mem_limit: 512m
    cpus: 1

volumes:
  pgdata:
